[package]
name = "scriptura"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Keeps AGENTS.md, DESIGN.md and README.md of your own repositories up to date after each push."

[features]
# 管理画面（`scriptura ui`）。既定で有効。外したビルドでは axum・askama・tokio を一切リンクしない
# （hook の経路は常に tokio を使わない）。
default = ["ui"]
ui = ["dep:axum", "dep:askama", "dep:tokio", "dep:getrandom"]
test-support = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
regex = "1"
caseless = "0.2"
globset = "0.4"
chrono = "0.4"
toml = "0.9"
url = "2"
wait-timeout = "0.2"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem"] }
# 管理画面（feature "ui"）だけが使う。SSR（askama）+ axum + tokio、乱数は OS の CSPRNG（getrandom）。
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query"], optional = true }
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"], optional = true }
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "signal", "time", "sync", "macros"], optional = true }
getrandom = { version = "0.4.3", optional = true }

[dev-dependencies]
# 管理画面のテスト（tests/ui.rs）は Router を `tower::ServiceExt::oneshot` で直接呼ぶ。
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"

[lib]
name = "scriptura"

[[bin]]
name = "scriptura"
path = "src/bin/scriptura.rs"

[[bin]]
name = "hook-test-stub"
path = "tests/support/stub.rs"
required-features = ["test-support"]
