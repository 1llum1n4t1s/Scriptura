[package]
name = "scriptura"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Keeps AGENTS.md, DESIGN.md and README.md of your own repositories up to date after each push."

[features]
test-support = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
regex = "1"
caseless = "0.2"
chrono = "0.4"
toml = "0.9"
url = "2"
wait-timeout = "0.2"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem"] }

[lib]
name = "scriptura"

[[bin]]
name = "scriptura"
path = "src/bin/scriptura.rs"

[[bin]]
name = "hook-test-stub"
path = "tests/support/stub.rs"
required-features = ["test-support"]
