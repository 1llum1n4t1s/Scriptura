[package]
name = "scriptura"
version = "1.0.12"
edition = "2024"
rust-version = "1.100"
description = "Keeps AGENTS.md, DESIGN.md and README.md of your own repositories up to date after each push."

[features]
# 管理画面（`scriptura ui`）。既定で有効。外したビルドでは axum・askama・tokio を一切リンクしない
# （hook の経路は常に tokio を使わない）。
default = ["ui"]
# 常駐（`scriptura ui --tray`）の macOS 側は AppKit を直接使う（objc2 系。macOS 向けのビルドにだけ入る）。
ui = ["dep:axum", "dep:askama", "dep:tokio", "dep:getrandom", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]
test-support = []
# 隔離した E2E 検証専用（本番ビルドには入れない）。更新元をローカルフォルダーへ差し替える環境変数
# `SCRIPTURA_UPDATE_FEED_DIR` と、未署名パッケージの適用を許す `SCRIPTURA_UPDATE_ALLOW_UNSIGNED=1` を有効にする。
update-feed-test = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
rusqlite = { version = "0.43", features = ["bundled"] }
sha2 = "0.11"
regex = "1"
caseless = "0.2"
globset = "0.4"
chrono = "0.4"
toml = "1.2"
url = "2"
wait-timeout = "0.2"
uuid = { version = "1", features = ["v4"] }
# 署名者検証（app_update::trust）のエラー型。velopack が既に依存しているので新しい crate は増えない。
anyhow = "1"
# Setup（Velopack）導入版のフック処理・更新の確認と取得・適用（版は Remnifold・Skilvella と揃える）。
# 既定の機能を切り、HTTP は velopack 内蔵の ureq（blocking）を使う。tokio を引き込まない（hook の経路の方針）。
# public-utils は依存を増やさず `velopack::bundle` を公開するだけの機能で、macOS の署名検証で
# UpdateMac と同じ関数で nupkg を展開するために使う。
velopack = { version = "=1.2.161", default-features = false, features = ["public-utils"] }
# 適用前の署名者検証で nupkg（zip）の中身を列挙・取り出す。RUSTSEC-2026-0367 / 0368 / 0369 / 0429
# （8.6 系は 9.0.0 未満が影響を受ける）を解消するため、本体自身は 9.x を使う。velopack =1.2.161
# （AGENTS.md の恒久契約で固定）経由の zip 8.6 は velopack を更新できるまで残るため、zip は独立した 2 版になる。
zip = { version = "9.7", default-features = false, features = ["deflate"] }
# 管理画面のモデル一覧の取得（ui::models。明示の更新操作のときだけ blocking で呼ぶ）。velopack が既に同じ crate を
# 既定の機能（rustls・gzip）で使っているので、新しい crate は増えない（tokio も引き込まない）。
ureq = "3.4"
# 管理画面（feature "ui"）だけが使う。SSR（askama）+ axum + tokio、乱数は OS の CSPRNG（getrandom）。
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query"], optional = true }
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"], optional = true }
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "signal", "time", "sync", "macros"], optional = true }
getrandom = { version = "0.4.3", optional = true }

# 管理画面の常駐（feature "ui" の `--tray`）がメニューバーの項目に使う。トレイ用の crate は足さず、Skilvella と同じ版の
# objc2 系で AppKit を直接扱う。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"], optional = true }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSButton", "NSCell", "NSControl", "NSEvent", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "objc2-core-foundation"], optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSDate", "NSGeometry", "NSObject", "NSRunLoop", "NSString", "NSTimer"], optional = true }

# Windows の Job Object・レジストリ・Authenticode・トレイなど OS 連携だけが使う。使う箇所はすべて `cfg(windows)` なので、
# macOS・Linux のビルドには入れない（入れると unused dependency の警告が出て、使わない crate もコンパイルされる）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_LibraryLoader"] }

[dev-dependencies]
# 管理画面のテスト（tests/ui.rs）は Router を `tower::ServiceExt::oneshot` で直接呼ぶ。
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"

[lib]
name = "scriptura"

[[bin]]
name = "scriptura"
path = "src/bin/scriptura.rs"

[[bin]]
name = "hook-test-stub"
path = "tests/support/stub.rs"
required-features = ["test-support"]
