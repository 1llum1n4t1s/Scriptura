name: Velopack Linux

# Linux（x64 / ARM64）の Setup（Velopack の AppImage）版を、GitHub 提供のランナーでネイティブにビルドして検証する。
# R2 へは書かない。Environment も Secrets も使わない（checkout は自動発行の読み取り専用トークンだけを使う）。
#
# 中身:
#   1. cargo nextest run --locked --features test-support（Linux で走るもの。cargo-nextest は固定版の公式バイナリを SHA-256 照合して入れる）。
#   2. update-feed-test 付きでビルドし、scripts/velopack/pack-linux.sh でテスト用 packId の 9.0.0 / 9.0.1 を作る。
#   3. scripts/velopack/e2e-linux.sh で隔離 E2E（導入 → 登録・autostart → 複数 hook で取得1回 → busy → 適用 → 解除）。
# 実行可能な Actions は使わず git で checkout する。Node.js は使わない。
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      # askama がコンパイル時に読むテンプレート、include_str! で埋め込む資材、tests/plugin_layout.rs が読む
      # プラグイン、テストの言語を固定する .cargo/config.toml も、変えたらテストを走らせる。
      - 'templates/**'
      - 'assets/**'
      - 'plugins/**'
      - '.claude-plugin/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'build.rs'
      - 'scripts/velopack/**'
      - '.github/workflows/velopack-linux.yml'
      - 'Cargo.lock'

permissions:
  contents: read

concurrency:
  group: velopack-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc の下限が黙って上がらないよう、ubuntu-latest ではなく ubuntu-24.04（glibc 2.39）に固定する
          # （release-velopack.yml の linux-installer と同じ）。
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      # vpk 1.2.161 を、ランナーにある新しい .NET でも動かす（ランナーに合う版が無い場合に備える）。
      DOTNET_ROLL_FORWARD: Major
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out exact source commit without executable Actions
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git config core.autocrlf false
          git config core.eol lf
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          authorization="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\r\n')"
          printf '::add-mask::%s\n' "$authorization"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          unset GIT_CONFIG_VALUE_0 GIT_CONFIG_KEY_0 GIT_CONFIG_COUNT CHECKOUT_TOKEN authorization
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Configure isolated work directories
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/scriptura-velopack-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.arch }}"
          test ! -e "$root"
          mkdir -p "$root"/{tmp,tools,dotnet-home,nuget,validation,pack-9.0.0,pack-9.0.1,e2e}
          {
            printf 'CI_ROOT=%s\n' "$root"
            printf 'TEMP=%s/tmp\nTMP=%s/tmp\nTMPDIR=%s/tmp\n' "$root" "$root" "$root"
            printf 'CARGO_TARGET_DIR=%s/build\n' "$root"
            printf 'DOTNET_CLI_HOME=%s/dotnet-home\nNUGET_PACKAGES=%s/nuget\n' "$root" "$root"
          } >> "$GITHUB_ENV"

      - name: Install locked Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal && rustup default 1.100.0

      - name: Install Velopack CLI 1.2.161 into the work folder
        run: |
          set -euo pipefail
          # dotnet が無いランナーでは、作業フォルダーへ入れる（ランナーの全体には入れない）。
          if ! command -v dotnet >/dev/null; then
            curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$CI_ROOT/tools/dotnet-install.sh"
            bash "$CI_ROOT/tools/dotnet-install.sh" --channel 8.0 --install-dir "$CI_ROOT/tools/dotnet"
            printf '%s\n' "$CI_ROOT/tools/dotnet" >> "$GITHUB_PATH"
            # --tool-path で入れた vpk が、この dotnet を見つけられるようにする。
            printf 'DOTNET_ROOT=%s\n' "$CI_ROOT/tools/dotnet" >> "$GITHUB_ENV"
            export PATH="$CI_ROOT/tools/dotnet:$PATH" DOTNET_ROOT="$CI_ROOT/tools/dotnet"
          fi
          dotnet --version
          # tool-path で入れた vpk（apphost）は、DOTNET_ROOT が無いと既定の場所だけで runtime を探す。macOS のランナーの
          # dotnet は既定の場所の外にあり、hostfxr を見つけられずに終了コード 131（0x80008083）で落ちたため、実体の場所を渡す。
          if [[ -z "${DOTNET_ROOT:-}" ]]; then
            DOTNET_ROOT="$(dirname "$(python3 -c 'import os, shutil; print(os.path.realpath(shutil.which("dotnet")))')")"
            export DOTNET_ROOT
            printf 'DOTNET_ROOT=%s\n' "$DOTNET_ROOT" >> "$GITHUB_ENV"
          fi
          echo "DOTNET_ROOT=$DOTNET_ROOT"
          dotnet tool install vpk --version 1.2.161 --tool-path "$CI_ROOT/tools/vpk"
          printf '%s\n' "$CI_ROOT/tools/vpk" >> "$GITHUB_PATH"
          # 出力を変数に取ってから照合する（パイプで grep -q が先に終わると、pipefail で誤って失敗になるため）。
          help="$("$CI_ROOT/tools/vpk/vpk" --skip-updates --help 2>&1 | sed $'s/\x1b\\[[0-9;]*m//g')"
          grep -q 'Velopack CLI 1\.2\.161' <<<"$help" || { printf '%s\n' "$help"; exit 1; }

      - name: Check whitespace and script syntax
        run: |
          set -euo pipefail
          # クリーンな checkout では作業ツリーと index に差が無く、引数なしの `git diff --check` は常に空になる。
          # 空ツリー（4b825dc…）との比較にして、追跡している全ファイルの行末の空白などを実際に検査する。
          git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
          bash -n scripts/velopack/pack-linux.sh
          bash -n scripts/velopack/pack-macos.sh
          bash -n scripts/velopack/e2e-linux.sh

      - name: Test on Linux
        env:
          # x64 のランナー（ubuntu-24.04）は空きが少なく、テスト用バイナリ約 13 本のデバッグ情報で
          # ディスクが尽きて「No space left on device」でジョブごと落ちた。デバッグ情報を作らず、
          # 増分ビルドの中間物も残さない（テストの判定には不要）。
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: |
          set -euo pipefail
          # テストが利用者の設定・状態へ書かないよう、保存場所を作業フォルダーへ隔離する。
          export SCRIPTURA_HOME="$CI_ROOT/validation/scriptura-home"
          export NO_PROXY=127.0.0.1,localhost,::1
          # ディスクの空きを前後で記録する（容量不足の再発を見分けるため）。
          df -h / "$CI_ROOT" || true
          # cargo-nextest（テストごとに別プロセスで並列実行する。.config/nextest.toml）は、公式リリースの固定版バイナリを
          # SHA-256 と照合してから展開する（ソースビルドは数分かかる）。版を上げるときは版と SHA-256 を同時に変える。
          nextest_version=0.9.152
          case "$(uname -m)" in
            x86_64) nextest_asset=x86_64-unknown-linux-gnu; nextest_sha256=d039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a ;;
            aarch64) nextest_asset=aarch64-unknown-linux-gnu; nextest_sha256=ca1f81a5b86533eb45ab97e0064aa88e925e53aab9a698ca6331a7cad1f85f07 ;;
            *) echo "Unsupported CPU for cargo-nextest: $(uname -m)" >&2; exit 1 ;;
          esac
          mkdir -p "$CI_ROOT/tools/nextest"
          curl -fsSL "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$nextest_version/cargo-nextest-$nextest_version-$nextest_asset.tar.gz" -o "$CI_ROOT/tools/nextest.tar.gz"
          printf '%s  %s\n' "$nextest_sha256" "$CI_ROOT/tools/nextest.tar.gz" | sha256sum -c -
          tar -xzf "$CI_ROOT/tools/nextest.tar.gz" -C "$CI_ROOT/tools/nextest"
          export PATH="$CI_ROOT/tools/nextest:$PATH"
          cargo nextest --version
          cargo nextest run --locked --features test-support
          # 他のテストと同時に動かせない 1 件（.config/nextest.toml の quiescence）を単独で実行する。
          cargo nextest run --locked --features test-support --profile quiescence
          df -h / "$CI_ROOT" || true

      - name: Check the build without the management screen
        # AGENTS.md の検証にある `--no-default-features`（管理画面 = feature "ui" を含まないビルド）。
        # コンパイルの可否だけを見るので、ディスクを使う成果物は作らない `cargo check` にする。
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: cargo check --locked --no-default-features --bin scriptura

      - name: Build the test executable and pack 9.0.0 / 9.0.1
        run: |
          set -euo pipefail
          # vpk は Linux 上では外部の mksquashfs で squashfs を作る（同梱は Windows 用だけ）。
          if ! command -v mksquashfs >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends squashfs-tools
          fi
          # テスト用の機能（ローカルの更新元）を付けたビルド。本番の梱包（pack-linux.sh の既定）では付けない。
          cargo build --locked --release --bin scriptura --features update-feed-test
          binary="$CARGO_TARGET_DIR/release/scriptura"
          for version in 9.0.0 9.0.1; do
            bash scripts/velopack/pack-linux.sh "$CI_ROOT/pack-$version" --pack-id ScripturaVelopackTest --version "$version" --binary "$binary"
          done

      - name: Make FUSE available when possible
        # AppImage のランタイムは setuid の fusermount を要る。無ければ入れてみる。入らなければ E2E が
        # APPIMAGE_EXTRACT_AND_RUN=1 へ切り替え、どちらで動いたかをログに出す。
        run: |
          set -euo pipefail
          if command -v fusermount3 >/dev/null || command -v fusermount >/dev/null; then
            echo 'fusermount is available'
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fuse3 || echo 'fuse3 could not be installed; the E2E will extract and run instead'
          fi
          ls -l /dev/fuse || true

      - name: Isolated Setup E2E (register, download once, busy, apply, uninstall)
        run: bash scripts/velopack/e2e-linux.sh "$CI_ROOT/e2e" --old "$CI_ROOT/pack-9.0.0/packages" --new "$CI_ROOT/pack-9.0.1/packages"
