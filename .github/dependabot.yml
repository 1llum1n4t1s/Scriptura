version: 2
updates:
  # ルートの Cargo.toml（本体）。
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # xtask（プラグイン配布物の梱包ツール）は空の [workspace] で切り離してあり、自前の Cargo.toml / Cargo.lock を持つ。
  - package-ecosystem: "cargo"
    directory: "/xtask"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
