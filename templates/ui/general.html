{% extends "ui/base.html" %}
{% block content %}
<div class="heading"><h1>{{ crate::locale::tr("ui.title.general") }}</h1></div>
<section class="panel">
  <form method="post" action="/settings/general" class="stack">
    <input type="hidden" name="csrf" value="{{ layout.csrf }}"><input type="hidden" name="revision" value="{{ revision }}">
    <label>{{ crate::locale::tr("ui.general.mode") }}<select name="mode">{% for c in modes %}<option value="{{ c.value }}"{% if c.selected %} selected{% endif %}>{{ c.label }}</option>{% endfor %}</select></label>
    <fieldset class="choices"><legend>{{ crate::locale::tr("ui.general.documents") }}</legend>
      {% for d in documents %}<label class="checkbox"><input type="checkbox" name="documents" value="{{ d.value }}"{% if d.selected %} checked{% endif %}>{{ d.label }}</label>
      {% endfor %}
    </fieldset>
    <label>{{ crate::locale::tr("ui.general.exclude") }}<textarea name="exclude" rows="3">{{ exclude }}</textarea></label>
    <label>{{ crate::locale::tr1("ui.general.instructions", "max", instructions_max) }}<textarea name="instructions" rows="4" data-max="{{ instructions_max }}">{{ instructions }}</textarea><span class="counter" data-for="instructions"></span></label>
    <fieldset class="choices"><legend>{{ crate::locale::tr("ui.general.enrollment") }}</legend>
      <label>{{ crate::locale::tr("ui.general.policy") }}<select name="policy">{% for c in policies %}<option value="{{ c.value }}"{% if c.selected %} selected{% endif %}>{{ c.label }}</option>{% endfor %}</select></label>
      <label>{{ crate::locale::tr("ui.general.owners") }}<textarea name="owners" rows="2">{{ owners }}</textarea></label>
    </fieldset>
    <div class="actions"><button class="primary" type="submit">{{ crate::locale::tr("ui.common.save") }}</button></div>
  </form>
  <p class="note">{{ crate::locale::tr("ui.general.note") }}</p>
</section>
{% endblock %}
