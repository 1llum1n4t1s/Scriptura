{% extends "ui/base.html" %}
{% block content %}
<div class="heading"><h1>全般設定</h1></div>
<section class="panel">
  <form method="post" action="/settings/general" class="stack">
    <input type="hidden" name="csrf" value="{{ layout.csrf }}"><input type="hidden" name="revision" value="{{ revision }}">
    <label>既定のモード（登録でモードを指定しないとき）<select name="mode">{% for c in modes %}<option value="{{ c.value }}"{% if c.selected %} selected{% endif %}>{{ c.label }}</option>{% endfor %}</select></label>
    <fieldset class="choices"><legend>既定の対象の文書</legend>
      {% for d in documents %}<label class="checkbox"><input type="checkbox" name="documents" value="{{ d.value }}"{% if d.selected %} checked{% endif %}>{{ d.label }}</label>
      {% endfor %}
    </fieldset>
    <label>除外するパターン（glob を 1 行に 1 つ。既定の機密パターンに加算されます）<textarea name="exclude" rows="3">{{ exclude }}</textarea></label>
    <label>全種類共通の追加の編集指示（{{ instructions_max }} 字以内）<textarea name="instructions" rows="4" data-max="{{ instructions_max }}">{{ instructions }}</textarea><span class="counter" data-for="instructions"></span></label>
    <fieldset class="choices"><legend>自動登録</legend>
      <label>方針<select name="policy">{% for c in policies %}<option value="{{ c.value }}"{% if c.selected %} selected{% endif %}>{{ c.label }}</option>{% endfor %}</select></label>
      <label>owner（host/owner を 1 行に 1 つ。remote-owner のとき使います）<textarea name="owners" rows="2">{{ owners }}</textarea></label>
    </fieldset>
    <div class="actions"><button class="primary" type="submit">保存する</button></div>
  </form>
  <p class="note">自動登録の方針を all / remote-owner にする変更は確認画面を挟みます。</p>
</section>
{% endblock %}
