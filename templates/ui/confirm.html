{% extends "ui/base.html" %}
{% block content %}
<section class="panel">
  <h1>確認してください</h1>
  <p>次の変更を行います。内容を確認し、よければ「実行する」を押してください（この確認は 10 分間・1 回だけ有効です）。</p>
  <ul class="dangers">
  {% for d in dangers %}<li>{{ d }}</li>{% endfor %}
  </ul>
  <form method="post" action="{{ action }}">
    <input type="hidden" name="csrf" value="{{ layout.csrf }}">
    <input type="hidden" name="confirm" value="{{ nonce }}">
    {% for f in fields %}<input type="hidden" name="{{ f.name }}" value="{{ f.value }}">
    {% endfor %}
    <div class="actions"><button class="primary" type="submit">実行する</button><a class="button" href="{{ back }}">やめる</a></div>
  </form>
</section>
{% endblock %}
