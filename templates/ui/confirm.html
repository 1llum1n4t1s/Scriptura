{% extends "ui/base.html" %}
{% block content %}
<section class="panel">
  <h1>{{ crate::locale::tr("ui.confirm.title") }}</h1>
  <p>{{ crate::locale::tr("ui.confirm.lead") }}</p>
  <ul class="dangers">
  {% for d in dangers %}<li>{{ d }}</li>{% endfor %}
  </ul>
  <form method="post" action="{{ action }}">
    <input type="hidden" name="csrf" value="{{ layout.csrf }}">
    <input type="hidden" name="confirm" value="{{ nonce }}">
    {% for f in fields %}<input type="hidden" name="{{ f.name }}" value="{{ f.value }}">
    {% endfor %}
    <div class="actions"><button class="primary" type="submit">{{ crate::locale::tr("ui.confirm.run") }}</button><a class="button" href="{{ back }}">{{ crate::locale::tr("ui.confirm.cancel") }}</a></div>
  </form>
</section>
{% endblock %}
