{% extends "ui/base.html" %}
{% block content %}
<div class="heading"><h1>{{ crate::locale::tr("ui.title.worker") }}</h1></div>
<section class="panel">
  <form method="post" action="/settings/worker" class="stack">
    <input type="hidden" name="csrf" value="{{ layout.csrf }}"><input type="hidden" name="revision" value="{{ revision }}">
    <div class="row">
      <label>{{ crate::locale::tr("ui.worker.model") }}<input name="model" value="{{ model }}" required></label>
      <label>effort<input name="effort" value="{{ effort }}" required></label>
    </div>
    <div class="row">
      <label>{{ crate::locale::tr2("ui.worker.timeout", "min", timeout_min, "max", timeout_max) }}<input name="timeout_secs" inputmode="numeric" value="{{ timeout_secs }}"></label>
      <label>{{ crate::locale::tr("ui.worker.budget") }}<input name="max_budget_usd" inputmode="decimal" value="{{ max_budget_usd }}"></label>
    </div>
    <label>{{ crate::locale::tr("ui.worker.permission") }}<select name="permission">{% for c in permission %}<option value="{{ c.value }}"{% if c.selected %} selected{% endif %}>{{ c.label }}</option>{% endfor %}</select></label>
    <label>{{ crate::locale::tr("ui.worker.claude_path") }}<input name="claude_path" value="{{ claude_path }}"></label>
    <p class="note">{{ claude_state }}</p>
    <div class="actions"><button class="primary" type="submit">{{ crate::locale::tr("ui.common.save") }}</button></div>
  </form>
  <p class="note">{{ crate::locale::tr("ui.worker.note") }}</p>
</section>
{% endblock %}
